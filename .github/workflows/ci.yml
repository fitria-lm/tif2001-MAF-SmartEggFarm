name: Smart Egg Farm - Continuous Integration (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Code Linting & Validation Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
          else
            echo "package.json belum ada di root, melewati npm install."
          fi

      - name: Run Linter Check
        run: |
          if grep -q '"lint"' package.json 2>/dev/null; then
            npm run lint
          else
            echo "Skrip lint belum dikonfigurasi di package.json, langkah dilewati."
          fi

      - name: Verify Code Structure & DDL Schema
        run: |
          echo "Pemeriksaan struktur proyek Smart Egg Farm berhasil."