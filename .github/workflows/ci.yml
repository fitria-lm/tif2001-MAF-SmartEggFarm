name: Smart Egg Farm - Continuous Integration (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Code Linting & Automated Unit Testing
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: |
          if [ -f package.json ]; then
            npm install
          else
            echo "package.json tidak ditemukan, melewati instalasi."
          fi

      - name: Run Linter Check
        run: |
          if [ -f package.json ] && grep -q '"lint"' package.json; then
            npm run lint
          else
            echo "Skrip lint belum dikonfigurasi, langkah dilewati."
          fi

      - name: Run Automated Unit Tests
        run: |
          if [ -f package.json ] && grep -q '"test"' package.json; then
            npm test
          else
            echo "Skrip test belum dikonfigurasi, langkah dilewati."
          fi